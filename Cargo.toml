[package]
name = "nezha-agent"
version = "1.0.0"
edition = "2021"
description = "哪吒监控 Agent - Rust 高性能实现"
license = "Apache-2.0"

[[bin]]
name = "nezha-agent"
path = "src/main.rs"

[dependencies]
# gRPC / Protobuf
tonic = { version = "0.13", features = ["tls-native-roots", "channel", "transport"] }
prost = "0.13"

# Async Runtime
tokio = { version = "1", features = ["rt", "macros", "net", "time", "process", "signal", "io-util", "sync", "fs"] }
tokio-stream = { version = "0.1", features = ["net"] }

# System Info
sysinfo = "0.33"

# Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP Client
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }

# ICMP Ping
surge-ping = "0.8"

# UUID
uuid = { version = "1", features = ["v4"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# PTY
portable-pty = "0.8"

# Utilities
nix = { version = "0.29", features = ["signal", "process", "fs"] }
md-5 = "0.10"
rand = "0.9"

# Aho-Corasick for NIC filtering
aho-corasick = "1"

# Byte order
byteorder = "1"

# Error handling
anyhow = "1"

[build-dependencies]
tonic-build = "0.13"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
