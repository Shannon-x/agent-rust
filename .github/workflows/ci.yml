name: CI Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  PROTOC_VERSION: '28.3'

jobs:
  check:
    name: Lint & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install protoc
        run: |
          curl -sL https://github.com/protocolbuffers/protobuf/releases/download/v${{ env.PROTOC_VERSION }}/protoc-${{ env.PROTOC_VERSION }}-linux-x86_64.zip -o /tmp/protoc.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            name: linux_amd64
            cross: true
          - target: i686-unknown-linux-gnu
            name: linux_386
            cross: true
          - target: aarch64-unknown-linux-gnu
            name: linux_arm64
            cross: true
          - target: armv7-unknown-linux-gnueabihf
            name: linux_arm
            cross: true
          - target: riscv64gc-unknown-linux-gnu
            name: linux_riscv64
            cross: true
          - target: s390x-unknown-linux-gnu
            name: linux_s390x
            cross: true
          - target: x86_64-unknown-linux-musl
            name: linux_amd64_musl
            cross: true
          - target: aarch64-unknown-linux-musl
            name: linux_arm64_musl
            cross: true

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc
        run: |
          curl -sL https://github.com/protocolbuffers/protobuf/releases/download/v${{ env.PROTOC_VERSION }}/protoc-${{ env.PROTOC_VERSION }}-linux-x86_64.zip -o /tmp/protoc.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.toml') }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        run: |
          BINARY="target/${{ matrix.target }}/release/nezha-agent"
          ARCHIVE="nezha-agent_${{ matrix.name }}.zip"
          chmod +x "$BINARY"
          zip -j "$ARCHIVE" "$BINARY"
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nezha-agent_${{ matrix.name }}
          path: ${{ env.ARCHIVE }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -name '*.zip' -exec mv {} . \;
          sha256sum *.zip > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/checksums.txt
          generate_release_notes: true
